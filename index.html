<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#3B5BFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Чекбук">
<title>Чекбук — контроль расходов</title>
<!-- Установка как приложение: манифест и иконки лежат рядом с index.html (manifest.webmanifest, icon-*.png, sw.js) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Eager-библиотеки: нужны для первого экрана -->
<script src="https://cdn.tailwindcss.com"></script>
<script>try { tailwind.config = { darkMode: 'class', corePlugins: { preflight: false } }; } catch (e) {}</script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<!--
  АРХИТЕКТУРА: тяжёлые библиотеки (Tesseract ~3 МБ + языковые модели, html5-qrcode, html2pdf, SheetJS, html2canvas)
  грузятся ЛЕНИВО через Lib.load() в момент первого использования. Первый экран открывается мгновенно,
  а при подключённом sw.js всё кэшируется и работает офлайн.
-->

<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F4F6FA; --surface-3:#E6EAF2;
  --ink:#10162B; --muted:#6B7390; --faint:#A2A8BD; --line:rgba(16,22,43,.08);
  --accent:#3B5BFF; --accent-soft:rgba(59,91,255,.11); --on-accent:#fff;
  --violet:#8B5CF6; --pink:#EC4899; --orange:#F97316; --teal:#14B8A6; --sky:#0EA5E9;
  --grad:linear-gradient(135deg,#3B5BFF 0%,#8B5CF6 55%,#EC4899 100%);
  --grad-warm:linear-gradient(135deg,#F97316,#EC4899);
  --grad-fresh:linear-gradient(135deg,#10B981,#0EA5E9);
  --paper:#FBFAF6; --paper-ink:#23262E; --paper-line:rgba(35,38,46,.18);
  --green:#11A36B; --yellow:#E8A317; --red:#E5484D;
  --shadow-1:0 1px 1px rgba(16,22,43,.04),0 2px 6px rgba(16,22,43,.05);
  --shadow-2:0 10px 40px -12px rgba(16,22,43,.28);
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --sans:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
html.dark{
  --bg:#0C1124; --surface:#151B33; --surface-2:#1B2240; --surface-3:#252E52;
  --ink:#EEF1FA; --muted:#8C94B3; --faint:#5B6385; --line:rgba(238,241,250,.08);
  --accent:#6E8BFF; --accent-soft:rgba(110,139,255,.14);
  --paper:#F3F1EA; --shadow-1:0 1px 0 rgba(255,255,255,.03) inset; --shadow-2:0 14px 50px -10px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);background-image:radial-gradient(900px 500px at 110% -10%,rgba(139,92,246,.16),transparent 60%),radial-gradient(700px 480px at -20% 10%,rgba(14,165,233,.14),transparent 60%),radial-gradient(800px 600px at 50% 120%,rgba(236,72,153,.10),transparent 60%);background-attachment:fixed;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{background:var(--surface-2);border:1px solid transparent;border-radius:var(--r-sm);padding:10px 12px;outline:none;width:100%;transition:border-color .15s,background .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.lucide{width:20px;height:20px;stroke-width:1.9;flex:none}
.hidden{display:none!important}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- Layout ---------- */
#app{min-height:100%;display:flex}
#sidebar{display:none}
#main{flex:1;min-width:0;padding:calc(var(--safe-t) + 8px) 16px calc(110px + var(--safe-b));max-width:1120px;margin:0 auto;width:100%}
.topbar{display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 10px) 16px 12px;margin:calc(-8px - var(--safe-t)) -16px 12px;position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border-bottom:1px solid var(--line)}
.topbar h1{font-size:25px;font-weight:800;letter-spacing:-.03em;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
@media(max-width:380px){.topbar h1{font-size:22px}.status{padding:6px 8px}.status span:last-child{max-width:92px;overflow:hidden;text-overflow:ellipsis}}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:6px 10px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow-1);white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--green);display:block}
.status[data-s="saving"] i{background:var(--yellow);animation:pulse 1s infinite}
.status[data-s="error"] i{background:var(--red)}
.status[data-s="warn"] i{background:var(--yellow)}
.status[data-s="cloud"] i{background:var(--sky);box-shadow:0 0 0 3px rgba(14,165,233,.2)}
@keyframes pulse{50%{opacity:.3}}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow-1);transition:transform .15s var(--ease)}
.icon-btn:active{transform:scale(.94)}

@media (min-width:1024px){
  #sidebar{display:flex;flex-direction:column;gap:4px;width:250px;flex:none;padding:24px 16px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line)}
  #main{padding:0 36px 48px}
  .topbar{margin:0 -36px 14px;padding:14px 36px}
  #tabbar,#fab-wrap{display:none!important}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em;margin:0 8px 22px}
  .side-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:600;transition:background .15s}
  .side-link:hover{background:var(--surface)}
  .side-link.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
  .side-link svg{color:var(--tc)}
  .side-actions{margin-top:auto;display:grid;gap:8px}
}
.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px -6px var(--violet)}

/* ---------- Tab bar & FAB ---------- */
#tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--safe-b));height:64px;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-radius:22px;box-shadow:var(--shadow-2);border:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--faint);padding:6px 0;transition:color .2s}
.tab.active{color:var(--tc,var(--accent))}
.tab.active svg{filter:drop-shadow(0 3px 6px color-mix(in srgb,var(--tc,var(--accent)) 45%,transparent))}
.tab[data-nav="home"]{--tc:#3B5BFF}.tab[data-nav="history"]{--tc:#F97316}.tab[data-nav="categories"]{--tc:#10B981}.tab[data-nav="analytics"]{--tc:#8B5CF6}
.side-link[data-nav="home"]{--tc:#3B5BFF}.side-link[data-nav="history"]{--tc:#F97316}.side-link[data-nav="categories"]{--tc:#10B981}.side-link[data-nav="analytics"]{--tc:#8B5CF6}.side-link[data-nav="settings"]{--tc:#64748B}
.tab svg.lucide{width:22px;height:22px}
#fab-wrap{position:fixed;left:50%;bottom:calc(18px + var(--safe-b));transform:translateX(-50%);z-index:45}
#fab{width:58px;height:58px;border-radius:20px;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 12px 28px -6px rgba(139,92,246,.7);transition:transform .3s var(--ease)}
#fab svg{width:26px;height:26px;transition:transform .3s var(--ease)}
#fab-wrap.open #fab svg{transform:rotate(45deg)}
.fab-menu{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);display:grid;gap:10px;pointer-events:none}
.fab-item{display:flex;align-items:center;gap:12px;white-space:nowrap;padding:12px 18px 12px 14px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow-2);font-weight:700;
  opacity:0;transform:translateY(16px) scale(.92);transition:all .28s var(--ease)}
#fab-wrap.open .fab-menu{pointer-events:auto}
#fab-wrap.open .fab-item{opacity:1;transform:none}
#fab-wrap.open .fab-item:nth-child(2){transition-delay:.04s} #fab-wrap.open .fab-item:nth-child(3){transition-delay:.08s}
.fab-item .fi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;background:var(--grad)}
.fab-item:nth-child(2) .fi{background:linear-gradient(135deg,#8B5CF6,#EC4899)} .fab-item:nth-child(3) .fi{background:var(--grad-warm)}
#fab-scrim{position:fixed;inset:0;z-index:44;background:rgba(12,17,36,.35);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
#fab-scrim.show{opacity:1;pointer-events:auto}

/* ---------- Surfaces ---------- */
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-1)}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:16px;margin:0 0 12px}
.card-title .link{font-size:13px;color:var(--accent);font-weight:700}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}
@media(min-width:760px){.grid-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.chart-box canvas{max-width:100%}
.section{margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;background:var(--surface-2);transition:transform .12s var(--ease),filter .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--grad);color:var(--on-accent);box-shadow:0 8px 20px -10px rgba(99,72,255,.9)}
.btn-danger{background:rgba(229,72,77,.12);color:var(--red)}
.btn-ghost{background:transparent;color:var(--accent);padding:8px 10px}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;background:var(--surface-2);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--grad);color:#fff}
.chip .dot{width:8px;height:8px;border-radius:50%}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:7px}
.seg{display:inline-flex;background:var(--surface-2);padding:3px;border-radius:12px;gap:2px}
.seg button{padding:7px 13px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 4px 12px -6px rgba(99,72,255,.9)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:grid;gap:10px}
.label{font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 6px;display:block}
.cat-ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.cat-ic svg{width:19px;height:19px}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.hscroll::-webkit-scrollbar{display:none}
.bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;transition:width .6s var(--ease)}
.empty{text-align:center;padding:36px 18px;color:var(--muted)}
.empty svg{width:34px;height:34px;color:var(--faint);margin-bottom:8px}
mark{background:rgba(232,163,23,.3);color:inherit;border-radius:3px;padding:0 1px}

/* ---------- Thermal paper (signature element) ---------- */
.paper{background:var(--paper);color:var(--paper-ink);font-family:var(--mono);position:relative;padding:22px 20px 26px;
  --zz:radial-gradient(circle at 6px 0,transparent 5.5px,var(--paper) 6px);
  filter:drop-shadow(0 8px 18px rgba(16,22,43,.14))}
.paper::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:9px;
  background:linear-gradient(135deg,var(--paper) 50%,transparent 50%) 0 0/16px 9px repeat-x,linear-gradient(225deg,var(--paper) 50%,transparent 50%) 0 0/16px 9px repeat-x}
.stack>*{min-width:0}
.btn{max-width:100%}
.btn-block{white-space:normal;text-align:center;line-height:1.2}
.ob-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.ob-row .btn{padding:12px 10px}
.paper .dash{border-top:1.5px dashed var(--paper-line);margin:12px 0}
.hero-paper{border-radius:18px 18px 0 0}
.hero-paper .caption{font-size:12px;letter-spacing:.02em;opacity:.7}
.hero-paper .total{font-family:var(--sans);font-weight:800;font-size:clamp(40px,11vw,60px);letter-spacing:-.045em;line-height:1;margin:8px 0 4px}
.hero-paper .lines{display:grid;gap:4px;font-size:13px}
.hero-paper .lines div{display:flex;justify-content:space-between;gap:10px}
.delta-up{color:#C4373C} .delta-down{color:#0E8A5B}

/* ---------- Lists & receipts ---------- */
.list{display:grid}
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .grow{flex:1;min-width:0}
.li .amt{font-weight:800;white-space:nowrap}
.swipe{position:relative;overflow:hidden;border-radius:14px}
.swipe-bg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-weight:700;font-size:13px}
.swipe-bg .l{color:var(--accent);display:flex;gap:6px;align-items:center} .swipe-bg .r{color:var(--red);display:flex;gap:6px;align-items:center}
.swipe-fg{position:relative;background:var(--surface);touch-action:pan-y;transition:transform .25s var(--ease)}
.swipe-fg.dragging{transition:none}
.rc{padding:12px 10px}
.rc-items{margin:0 10px 12px;padding:14px 14px 16px;border-radius:4px}
.rc-items .it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:12.5px;padding:4px 0}
.rc-items .it>span{overflow-wrap:anywhere}
.rc-items .it small{grid-column:1/-1;opacity:.6;font-size:11px}
.tree-h{display:flex;align-items:center;gap:10px;padding:12px 6px;font-weight:800;cursor:pointer;user-select:none}
.tree-h .chev{transition:transform .2s var(--ease);color:var(--faint)}
.tree-h.open .chev{transform:rotate(90deg)}
.tree-y{font-size:22px;letter-spacing:-.03em}
.tree-m{font-size:17px}
.tree-d{font-size:13px;color:var(--muted);font-weight:700;padding:14px 8px 6px}
.tree-body{padding-left:4px}

/* ---------- Sheets / modals ---------- */
.sheet-scrim{position:fixed;inset:0;background:rgba(8,12,28,.45);backdrop-filter:blur(4px);z-index:60;opacity:0;transition:opacity .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);border-radius:26px 26px 0 0;max-height:94vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .38s var(--ease);box-shadow:var(--shadow-2)}
.sheet.show{transform:none} .sheet-scrim.show{opacity:1}
.sheet.full{height:96vh;height:calc(100dvh - 12px - var(--safe-t))}
.sheet{max-height:calc(100dvh - 12px - var(--safe-t))}
@media(min-width:760px){.sheet{left:50%;right:auto;width:620px;bottom:auto;top:50%;border-radius:26px;transform:translate(-50%,-44%) scale(.97);opacity:0;transition:all .3s var(--ease);max-height:90vh}
  .sheet.show{transform:translate(-50%,-50%);opacity:1}.sheet.full{height:90vh}}
.sheet-grab{width:40px;height:5px;border-radius:9px;background:var(--surface-3);margin:8px auto 0}
.sheet-head{display:flex;align-items:center;gap:10px;padding:10px 18px 12px}
.sheet-head h2{flex:1;margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.sheet-body{overflow-y:auto;padding:4px 18px 18px;flex:1;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:12px 18px calc(12px + var(--safe-b));border-top:1px solid var(--line);display:flex;gap:10px;background:var(--bg)}

/* Editor rows */
.item-row{background:var(--surface);border-radius:14px;padding:10px;display:grid;gap:8px;grid-template-columns:1fr auto;align-items:center;transition:box-shadow .2s}
.item-row:focus-within{box-shadow:0 0 0 2px var(--accent-soft)}
.item-row .nm{grid-column:1/2;font-weight:600;background:transparent;padding:4px 2px}
.item-row .nm:focus{background:var(--surface-2)}
.item-row .ln2{grid-column:1/-1;display:grid;grid-template-columns:64px 14px 1fr 16px 1fr;gap:6px;align-items:center}
.item-row .ln2 input{padding:7px 8px;text-align:right}
.item-row .ln3{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.item-row select{padding:7px 10px;font-size:13px;font-weight:600}
.x{color:var(--faint);text-align:center;font-size:13px}
.skel{border-radius:12px;height:62px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite linear}
.skel.sm{height:18px;border-radius:6px}
@keyframes shimmer{to{background-position:-200% 0}}
.progress{height:4px;border-radius:9px;background:var(--surface-3);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tag-input{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface-2);border-radius:var(--r-sm);padding:7px}
.tag-input input{flex:1;min-width:90px;background:transparent;padding:4px;border:0}
.tag-input .tag button{display:grid;place-items:center;margin-left:2px}
.tag-input .tag svg{width:12px;height:12px}
.warn-box{display:flex;gap:10px;padding:12px;border-radius:14px;background:rgba(232,163,23,.13);font-size:13.5px;align-items:flex-start}
.warn-box svg{color:var(--yellow);margin-top:1px}
.info-box{display:flex;gap:10px;padding:12px;border-radius:14px;background:var(--accent-soft);font-size:13.5px;align-items:flex-start}
.info-box svg{color:var(--accent);margin-top:1px}
#qr-reader{border-radius:18px;overflow:hidden;background:#000;min-height:280px}
#qr-reader video{border-radius:18px}
.photo-thumb{width:64px;height:84px;border-radius:10px;object-fit:cover;background:var(--surface-2);flex:none}

/* Quick add */
.amount-input{font-size:46px;font-weight:800;letter-spacing:-.04em;text-align:center;background:transparent;border:0;padding:8px 0}
.amount-input:focus{background:transparent;border:0}
.qcat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;font-size:11.5px;font-weight:700;text-align:center;line-height:1.2;transition:transform .12s,background .15s}
.qcat:active{transform:scale(.94)}
.qcat:hover{background:var(--surface)}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}

/* Insights */
.tip{min-width:250px;max-width:290px;flex:none;display:flex;gap:10px;padding:14px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow-1);font-size:13.5px;line-height:1.4;border:1px solid var(--line)}
.tip.warn{background:linear-gradient(135deg,rgba(232,163,23,.16),var(--surface) 70%)} .tip.bad{background:linear-gradient(135deg,rgba(229,72,77,.15),var(--surface) 70%)}
.tip.good{background:linear-gradient(135deg,rgba(17,163,107,.15),var(--surface) 70%)} .tip.info{background:linear-gradient(135deg,rgba(139,92,246,.15),var(--surface) 70%)}
.tip .ti{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.tip.warn .ti{background:rgba(232,163,23,.15);color:var(--yellow)}
.tip.bad .ti{background:rgba(229,72,77,.13);color:var(--red)}
.tip.good .ti{background:rgba(17,163,107,.13);color:var(--green)}
.tip.info .ti{background:var(--accent-soft);color:var(--accent)}

/* Category cards */
.cat-card{--c:var(--accent);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 17%,var(--surface)) 0%,var(--surface) 72%);border-radius:20px;padding:16px;box-shadow:var(--shadow-1);display:grid;gap:10px;text-align:left;transition:transform .15s var(--ease);border:1px solid color-mix(in srgb,var(--c) 18%,transparent);min-width:0}
.cat-card:active{transform:scale(.98)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.kpi{display:grid;gap:2px}
.kpi b{font-size:22px;font-weight:800;letter-spacing:-.03em}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpis .kpi{padding:14px;border-radius:18px;color:#fff;box-shadow:0 10px 24px -14px rgba(16,22,43,.6)}
.kpis .kpi span{color:rgba(255,255,255,.85)}
.kpis .kpi:nth-child(1){background:var(--grad)} .kpis .kpi:nth-child(2){background:var(--grad-fresh)}
.kpis .kpi:nth-child(3){background:var(--grad-warm)} .kpis .kpi:nth-child(4){background:linear-gradient(135deg,#0EA5E9,#6366F1)}
.kpis .delta-up,.kpis .delta-down{color:#fff;background:rgba(255,255,255,.2);padding:1px 6px;border-radius:6px}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.chart-box{position:relative;height:240px}
.legend{display:grid;gap:2px;min-width:0}
.legend>button{width:100%;min-width:0;gap:10px}
.legend>button>span:first-child{min-width:0;flex:1}
.legend>button>span:last-child{flex:none}

/* Toast */
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + var(--safe-t));z-index:100;display:grid;gap:8px;width:min(420px,calc(100% - 24px))}
.toast{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--ink);color:var(--surface);box-shadow:var(--shadow-2);font-weight:600;font-size:14px;animation:tin .3s var(--ease)}
.toast .ta{margin-left:auto;font-weight:800;color:#9fb3ff;padding:4px 6px}
html.dark .toast{background:#EEF1FA;color:#10162B} html.dark .toast .ta{color:var(--accent)}
.toast.out{animation:tout .25s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-12px) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}

/* Lock */
#lock{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
.pin-dots{display:flex;gap:14px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--faint);transition:all .15s}
.pin-dots i.f{background:var(--ink);border-color:var(--ink)}
.pin-dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.key{height:76px;border-radius:50%;background:var(--surface);font-size:26px;font-weight:600;box-shadow:var(--shadow-1);display:grid;place-items:center}
.key:active{background:var(--surface-3)}

/* Share card (offscreen render) */
#render-root{position:fixed;left:-10000px;top:0;pointer-events:none}

/* ---------- Colour layer ---------- */
.hero-wrap{background:var(--grad);border-radius:26px;padding:14px 14px 24px;box-shadow:0 20px 40px -22px rgba(99,72,255,.9);position:relative;overflow:hidden}
.hero-wrap::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-70px;top:-90px;background:rgba(255,255,255,.14)}
.hero-wrap::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;left:-60px;bottom:-80px;background:rgba(255,255,255,.1)}
.hero-wrap .paper{z-index:1}
.card-title .ct{display:inline-flex;align-items:center;gap:9px;min-width:0}
.ct-ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.ct-ic svg{width:16px;height:16px}
.g1{background:var(--grad)} .g2{background:var(--grad-fresh)} .g3{background:var(--grad-warm)} .g4{background:linear-gradient(135deg,#0EA5E9,#6366F1)} .g5{background:linear-gradient(135deg,#14B8A6,#84CC16)} .g6{background:linear-gradient(135deg,#64748B,#334155)}
.sub-h{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.li .cat-ic{box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.ai-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#fff;background:var(--grad);padding:4px 10px;border-radius:99px}
.ai-badge svg{width:14px;height:14px}
.weak-dot{font-size:11px;font-weight:800;color:var(--yellow)}
html.dark .hero-wrap{box-shadow:0 20px 50px -20px rgba(139,92,246,.6)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   ЧЕКБУК — локальный менеджер расходов. Один файл, без сборки.
   Модули: Util · Lib · DB · Status · State · Cat · Img · OCR · AI · QR ·
           Dup · Insights · UI · Views · Editor · Quick · Share · Export · Pin · PWA · App
   ===================================================================== */

/* ============================== UTIL ============================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const pad = n => String(n).padStart(2, '0');
const num = s => { if (typeof s === 'number') return s; const v = parseFloat(String(s ?? '').replace(/\s/g, '').replace(',', '.')); return isNaN(v) ? 0 : v; };
const norm = s => String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я0-9%.\s-]/g, ' ').replace(/\s+/g, ' ').trim();
// В JS \b не работает с кириллицей — используем собственную границу слова WB
const WB = '(?:(?<![а-яa-z0-9])(?=[а-яa-z0-9])|(?<=[а-яa-z0-9])(?![а-яa-z0-9]))';
const cyr = re => new RegExp(re.source.replace(/\\b/g, WB), re.flags);
const STORE_JUNK = cyr(/\b(ооо|ип|ао|пао|зао|магазин|универсам|гипермаркет|супермаркет)\b/g);
const normStore = s => norm(s).replace(STORE_JUNK, '').replace(/\s+/g, ' ').trim();
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const haptic = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const plural = (n, f) => { n = Math.abs(n) % 100; const n1 = n % 10; if (n > 10 && n < 20) return f[2]; if (n1 > 1 && n1 < 5) return f[1]; if (n1 === 1) return f[0]; return f[2]; };
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_G = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];

const D = {
  // Все даты чеков хранятся как локальная строка 'YYYY-MM-DDTHH:mm' — без сдвигов часовых поясов.
  toLocal: d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`,
  parse: s => new Date(s.length <= 10 ? s + 'T00:00' : s),
  now: () => D.toLocal(new Date()),
  dayKey: s => s.slice(0, 10), monthKey: s => s.slice(0, 7), yearKey: s => s.slice(0, 4),
  dim: (y, m) => new Date(y, m + 1, 0).getDate(),
  startOfDay: d => new Date(d.getFullYear(), d.getMonth(), d.getDate()),
  addDays: (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; },
  startOfWeek: d => { const x = D.startOfDay(d); const wd = (x.getDay() + 6) % 7; return D.addDays(x, -wd); },
  fmtDay: s => { const d = D.parse(s); return `${WD[d.getDay()]}, ${d.getDate()} ${MONTHS_G[d.getMonth()]}`; },
  fmtDate: s => { const d = D.parse(s); return `${d.getDate()} ${MONTHS_G[d.getMonth()]} ${d.getFullYear()}`; },
  fmtShort: s => { const d = D.parse(s); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${String(d.getFullYear()).slice(2)}`; },
  time: s => s.slice(11, 16),
};

let _fmtCache = {};
function money(v, opts = {}) {
  const cur = S.settings.currency || 'RUB';
  // Никакого округления до рублей: копейки показываем всегда, кроме ровных сумм в кратком виде (44 000 р.)
  const whole = Math.abs(r2(v) - Math.round(r2(v))) < 0.001;
  const key = cur + (opts.short && whole ? 's' : '');
  if (!_fmtCache[key]) _fmtCache[key] = (() => { const o = { style: 'currency', currency: cur, minimumFractionDigits: opts.short && whole ? 0 : 2, maximumFractionDigits: opts.short && whole ? 0 : 2 }; try { return new Intl.NumberFormat('ru-RU', { ...o, currencyDisplay: 'narrowSymbol' }); } catch (e) { return new Intl.NumberFormat('ru-RU', o); } })();
  return _fmtCache[key].format(r2(v));
}
const pct = (a, b) => b ? Math.round((a / b) * 100) : 0;
const icons = () => { try { lucide.createIcons({ attrs: { 'stroke-width': 1.9 } }); } catch (e) {} };

/* ============================== LAZY LIBS ============================== */
const Lib = {
  urls: {
    tesseract: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
    qr: 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js',
    html2canvas: 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',
    html2pdf: 'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js',
    xlsx: 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
  },
  _p: {},
  load(name) {
    if (this._p[name]) return this._p[name];
    this._p[name] = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = this.urls[name]; s.async = true;
      s.onload = () => res(); s.onerror = () => { delete this._p[name]; rej(new Error('Не удалось загрузить модуль «' + name + '». Проверьте интернет — после первой загрузки он работает офлайн.')); };
      document.head.appendChild(s);
    });
    return this._p[name];
  }
};

/* ============================== CLAUDE BRIDGE ==============================
   Когда страница открыта как опубликованное приложение на claude.ai, среда даёт три возможности:
   • sample — Claude читает фото чека (без своего API-ключа, в рамках подписки пользователя);
   • db — личное облачное хранилище пользователя: чеки переживают очистку браузера и видны на всех устройствах;
   • downloads — сохранение файлов (Excel, PDF, копии).
   Вне claude.ai (свой хостинг) window.claude отсутствует — приложение работает автономно, как раньше. */
const Bridge = {
  framed: !!(window.claude && typeof window.claude.use === 'function'),
  sample: null, vision: false, maxImages: 1, db: null, uid: null, downloads: null, ready: Promise.resolve(),
  init() {
    if (!this.framed) return this.ready;
    const use = n => Promise.resolve().then(() => window.claude.use(n)).catch(() => null);
    this.ready = (async () => {
      const [s, db, user, dl] = await Promise.all([use('sample'), use('db'), use('user'), use('downloads')]);
      this.sample = s; this.downloads = dl;
      if (s) { try { const l = await s.limits(); if (l && l.images) { this.vision = true; this.maxImages = Math.max(1, Math.min(4, l.images.maxCount || 1)); } } catch (e) {} }
      if (db && user) { try { const id = await user.id(); if (id) { this.db = db; this.uid = id; } } catch (e) {} }
    })();
    return this.ready;
  },
};

/* ============================== STATUS ============================== */
const Status = {
  s: 'saved', text: '',
  set(s, text) { this.s = s; this.text = text || ''; this.paint(); },
  paint() {
    const el = $('#status'); if (!el) return;
    let s = this.s, text = this.text;
    if (s === 'saved') {
      if (Cloud.on() && Cloud.pending > 0) { s = 'saving'; text = 'Синхронизация…'; }
      else if (Cloud.on() && Cloud.err) { s = 'warn'; text = 'Только на устройстве'; }
      else if (Cloud.on()) { s = 'cloud'; text = 'В облаке'; }
    }
    el.dataset.s = s;
    el.lastElementChild.textContent = text || ({ saved: 'Все сохранено', saving: 'Сохранение…', error: 'Ошибка записи' }[s]);
    el.title = Cloud.on() ? 'Данные хранятся на устройстве и в вашем личном облаке Claude' : 'Данные хранятся в памяти этого браузера';
  }
};

/* ============================== DATABASE ==============================
   IndexedDB: receipts (без фото — список остаётся лёгким), photos (отдельно, по id чека),
   categories, kv (настройки, память магазинов/товаров, черновик).
   Каждая запись — транзакция с durability:'strict' и ожиданием oncomplete:
   UI сообщает «Все сохранено» только после реального коммита на диск. */
const DB = {
  db: null, name: 'chekbook-db', ver: 1,
  open() {
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('IndexedDB недоступна в этом браузере'));
      const r = indexedDB.open(this.name, this.ver);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('receipts')) { const s = d.createObjectStore('receipts', { keyPath: 'id' }); s.createIndex('datetime', 'datetime'); }
        if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos');
        if (!d.objectStoreNames.contains('categories')) d.createObjectStore('categories', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      };
      r.onsuccess = () => { this.db = r.result; this.db.onversionchange = () => { this.db.close(); UI.toast('База обновлена в другой вкладке — перезагрузите страницу', { sticky: true }); }; res(); };
      r.onerror = () => rej(r.error);
      r.onblocked = () => UI.toast('Закройте другие вкладки приложения');
    });
  },
  tx(stores, mode, fn) {
    return new Promise((res, rej) => {
      let t;
      try { t = this.db.transaction(stores, mode, { durability: 'strict' }); } catch (e) { try { t = this.db.transaction(stores, mode); } catch (e2) { return rej(e2); } }
      const box = {};
      t.oncomplete = () => res(box.v);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('Транзакция отменена'));
      try { fn(t, box); } catch (e) { try { t.abort(); } catch (_) {} rej(e); }
    });
  },
  async write(stores, fn) {
    Status.set('saving');
    try { const v = await this.tx(stores, 'readwrite', fn); Status.set('saved'); return v; }
    catch (e) { Status.set('error'); this.handleError(e); throw e; }
  },
  handleError(e) {
    console.error(e);
    if (e && (e.name === 'QuotaExceededError' || /quota/i.test(e.message))) {
      UI.toast('Память браузера заполнена. Сделайте резервную копию и удалите старые фото чеков', { sticky: true, action: 'Открыть', onAction: () => App.nav('settings') });
    } else UI.toast('Не удалось сохранить: ' + (e?.message || e), { sticky: true });
  },
  getAll(store) { return this.tx([store], 'readonly', (t, b) => { const r = t.objectStore(store).getAll(); r.onsuccess = () => b.v = r.result; }); },
  get(store, key) { return this.tx([store], 'readonly', (t, b) => { const r = t.objectStore(store).get(key); r.onsuccess = () => b.v = r.result; }); },
  put(store, val, key) { return this.write([store], t => key !== undefined ? t.objectStore(store).put(val, key) : t.objectStore(store).put(val)); },
  del(store, key) { return this.write([store], t => t.objectStore(store).delete(key)); },
  clear(stores) { return this.write(stores, t => stores.forEach(s => t.objectStore(s).clear())); },
  saveReceipt(r, photo) {
    return this.write(['receipts', 'photos'], t => {
      t.objectStore('receipts').put(r);
      if (photo) t.objectStore('photos').put(photo, r.id);
    });
  },
  deleteReceipt(id) { return this.write(['receipts', 'photos'], t => { t.objectStore('receipts').delete(id); t.objectStore('photos').delete(id); }); },
};

/* ============================== STATE ============================== */
// Валюта по часовому поясу устройства: Минск → BYN, Москва → RUB и т.д. (меняется в настройках)
const AUTO_CUR = (() => {
  const tz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { return ''; } })();

/* ============================== CLOUD SYNC ==============================
   Личное облако пользователя (data/users/<id>/…) — приватно, его не видит даже автор приложения.
   Документы: r-<id> — чек (без фото), settings, cats, memory. Удаление — «надгробие» {deleted:true},
   чтобы другие устройства тоже удалили чек. Конфликты: побеждает более свежий updatedAt.
   Записи идут строго по очереди, с повтором при временных сбоях. Фото остаются на устройстве. */
const Cloud = {
  pending: 0, err: null, q: Promise.resolve(), lastPull: 0, pulling: null,
  sync: { cats: 0, settings: 0, memory: 0 },
  on: () => !!(Bridge.db && Bridge.uid),
  col() { return Bridge.db.collection('data/users/' + Bridge.uid); },
  clean: o => JSON.parse(JSON.stringify(o)),
  put(docId, data) {
    if (!this.on()) return Promise.resolve();
    this.pending++; Status.paint();
    const body = this.clean({ ...data, k: docId });
    const job = async () => {
      for (let a = 0; a < 4; a++) {
        try { await this.col().doc(docId).set(body); this.err = null; return; }
        catch (e) {
          const c = e && e.code;
          if ((c === 'unavailable' || c === 'resource_exhausted') && a < 3) { await sleep((a + 1) * 900 + Math.random() * 700); continue; }
          throw e;
        }
      }
    };
    this.q = this.q.then(job).catch(e => this.fail(e)).finally(() => { this.pending--; Status.paint(); });
    return this.q;
  },
  fail(e) {
    console.warn('cloud', e); this.err = e || true;
    if (e && e.code === 'quota_exceeded') UI.toast('Облако заполнено — новые чеки сохраняются только на устройстве. Сделайте резервную копию', { sticky: true });
  },
  putReceipt(r) { const { ...b } = r; return this.put('r-' + r.id, b); },
  delReceipt(id) { return this.put('r-' + id, { deleted: true, updatedAt: Date.now() }); },
  markSync(k) { this.sync[k] = Date.now(); DB._rawPut('kv', this.sync, 'sync').catch(() => {}); },
  cats: debounce(function () { Cloud.markSync('cats'); Cloud.put('cats', { list: S.categories, updatedAt: Cloud.sync.cats }); }, 700),
  settings: debounce(function () { Cloud.markSync('settings'); const { aiKey, ...rest } = S.settings; Cloud.put('settings', { data: rest, updatedAt: Cloud.sync.settings }); }, 700),
  memory: debounce(function () {
    Cloud.markSync('memory');
    let items = S.memory.items, keys = Object.keys(items);
    if (keys.length > 5000) items = Object.fromEntries(keys.slice(-5000).map(k => [k, items[k]]));
    Cloud.put('memory', { items, stores: S.memory.stores, updatedAt: Cloud.sync.memory });
  }, 1500),
  async all() {
    const out = []; let last = '';
    for (let i = 0; i < 40; i++) {
      let q = this.col(); q = last ? q.where('k', '>', last).orderBy('k').limit(500) : q.orderBy('k').limit(500);
      const snap = await q.get(); snap.docs.forEach(d => { if (d.exists) out.push([d.id, d.data()]); });
      if (snap.docs.length < 500) break; last = snap.docs[snap.docs.length - 1].data().k;
    }
    return out;
  },
  // Слияние облака и устройства. Возвращает true, если локальные данные изменились.
  pull() {
    if (!this.on()) return Promise.resolve(false);
    if (this.pulling) return this.pulling;
    this.pulling = (async () => {
      let docs; try { docs = await this.all(); } catch (e) { this.fail(e); Status.paint(); return false; }
      this.lastPull = Date.now(); this.err = null;
      const remote = Object.fromEntries(docs);
      const toLocal = [], toDelete = [];
      for (const [id, v] of docs) {
        if (!id.startsWith('r-')) continue;
        const rid = id.slice(2), loc = S.receipts.find(x => x.id === rid);
        if (v.deleted) { if (loc && (loc.updatedAt || 0) <= (v.updatedAt || 0)) toDelete.push(rid); }
        else if (!loc || (v.updatedAt || 0) > (loc.updatedAt || 0)) { const { k, ...r } = v; if (!loc) r.hasPhoto = false; else r.hasPhoto = !!loc.hasPhoto; if (r.id && r.datetime && Array.isArray(r.items)) toLocal.push(r); }
      }
      const toPush = S.receipts.filter(r => { const v = remote['r-' + r.id]; return !v || (r.updatedAt || 0) > (v.updatedAt || 0); });
      let changed = !!(toLocal.length || toDelete.length);
      // Настройки / категории / память
      const rs = remote.settings, rc = remote.cats, rm = remote.memory;
      if (rs && (rs.updatedAt || 0) > this.sync.settings) { const keep = { aiKey: S.settings.aiKey }; S.settings = { ...DEFAULT_SETTINGS, ...rs.data, ...keep }; S.settings.tagBudgets = S.settings.tagBudgets || {}; this.sync.settings = rs.updatedAt; await DB._rawPut('kv', S.settings, 'settings'); changed = true; _fmtCache = {}; }
      else if (!rs || this.sync.settings > (rs.updatedAt || 0)) this.settings();
      if (rc && Array.isArray(rc.list) && rc.list.length && (rc.updatedAt || 0) > this.sync.cats) { S.categories = rc.list.filter(c => c && c.id && c.id !== 'other'); this.sync.cats = rc.updatedAt; await DB.write(['categories'], t => { const C = t.objectStore('categories'); C.clear(); S.categories.forEach(c => C.put(c)); }); changed = true; }
      else if (!rc || this.sync.cats > (rc.updatedAt || 0)) this.cats();
      if (rm) {
        const before = JSON.stringify(S.memory).length;
        S.memory.items = { ...(rm.items || {}), ...S.memory.items }; S.memory.stores = { ...(rm.stores || {}), ...S.memory.stores };
        if (JSON.stringify(S.memory).length !== before) await DB._rawPut('kv', S.memory, 'memory');
        if ((rm.updatedAt || 0) < this.sync.memory || Object.keys(S.memory.items).length > Object.keys(rm.items || {}).length) this.memory();
      } else if (Object.keys(S.memory.items).length) this.memory();
      await DB._rawPut('kv', this.sync, 'sync');
      if (toLocal.length || toDelete.length) {
        await DB.write(['receipts', 'photos'], t => { const R = t.objectStore('receipts'); toLocal.forEach(r => R.put(r)); toDelete.forEach(id => { R.delete(id); t.objectStore('photos').delete(id); }); });
        toLocal.forEach(r => { const i = S.receipts.findIndex(x => x.id === r.id); if (i >= 0) S.receipts[i] = r; else S.receipts.push(r); });
        S.receipts = S.receipts.filter(r => !toDelete.includes(r.id));
      }
      toPush.forEach(r => this.putReceipt(r));
      Status.paint();
      return changed;
    })().finally(() => { this.pulling = null; });
    return this.pulling;
  },
  wipe() { if (!this.on()) return; S.receipts.forEach(r => this.delReceipt(r.id)); },
};
// Перехват записей в локальную базу → зеркалирование в облако (локальная запись всегда первая: zero-loss)
DB._rawPut = DB.put.bind(DB);
(() => {
  const save = DB.saveReceipt.bind(DB), del = DB.deleteReceipt.bind(DB), put = DB.put.bind(DB), delKey = DB.del.bind(DB);
  DB.saveReceipt = async (r, photo) => { r.updatedAt = Date.now(); await save(r, photo); Cloud.putReceipt(r); };
  DB.deleteReceipt = async id => { await del(id); Cloud.delReceipt(id); };
  DB.put = async (store, val, key) => {
    const v = await put(store, val, key);
    if (Cloud.on()) { if (store === 'categories') Cloud.cats(); else if (store === 'kv' && key === 'settings') Cloud.settings(); else if (store === 'kv' && key === 'memory') Cloud.memory(); }
    return v;
  };
  DB.del = async (store, key) => { const v = await delKey(store, key); if (store === 'categories') Cloud.cats(); return v; };
})();

const UI = {
  toast(text, { action, onAction, sticky, ms = 3200, icon } = {}) {
    const el = document.createElement('div');

    $('#toasts').appendChild(el); icons();
    const close = () => { el.classList.add('out'); setTimeout(() => el.remove(), 260); };
    if (action) el.querySelector('.ta').onclick = () => { close(); onAction && onAction(); };

    if (!sticky) setTimeout(close, action ? Math.max(ms, 5000) : ms);
    return close;
  },
  _stack: [],
  sheet({ title, body, foot, full, onClose, cls = '' }) {
    const scrim = document.createElement('div'); scrim.className = 'sheet-scrim';
    const sh = document.createElement('div'); sh.className = `sheet ${full ? 'full' : ''} ${cls}`;
    sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-modal', 'true');
    sh.innerHTML = `<div class="sheet-grab"></div><div class="sheet-head"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Закрыть"><i data-lucide="x"></i></button></div>
      <div class="sheet-body">${body || ''}</div>${foot ? `<div class="sheet-foot">${foot}</div>` : ''}`;
    $('#sheets').append(scrim, sh); icons();
    requestAnimationFrame(() => { scrim.classList.add('show'); sh.classList.add('show'); });
    const api = {
      el: sh, body: sh.querySelector('.sheet-body'),
      close: (silent) => {
        UI._stack = UI._stack.filter(x => x !== api);
        scrim.classList.remove('show'); sh.classList.remove('show');
        setTimeout(() => { scrim.remove(); sh.remove(); }, 380);
        if (!silent && onClose) onClose();
      }
    };
    scrim.onclick = () => api.close(); sh.querySelector('[data-close]').onclick = () => api.close();
    // Свайп вниз за «ручку» закрывает лист — как в iOS
    const grab = sh.querySelector('.sheet-grab'); let y0 = null;
    const head = sh.querySelector('.sheet-head');
    [grab, head].forEach(h => {
      h.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; sh.style.transition = 'none'; }, { passive: true });
      h.addEventListener('touchmove', e => { if (y0 === null) return; const dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, { passive: true });
      h.addEventListener('touchend', e => { if (y0 === null) return; const dy = e.changedTouches[0].clientY - y0; sh.style.transition = ''; sh.style.transform = ''; y0 = null; if (dy > 110) api.close(); });
    });
    UI._stack.push(api);
    return api;
  },
  choice({ title, text, options }) {
    return new Promise(res => {
      let done = false;
      const s = UI.sheet({
        title, body: `<p class="muted" style="margin:0 0 16px">${text}</p><div class="stack">${options.map((o, i) => `<button class="btn btn-block ${o.cls || ''}" data-i="${i}">${o.icon ? `<i data-lucide="${o.icon}"></i>` : ''}${esc(o.label)}</button>`).join('')}</div><div style="height:6px"></div>`,
        onClose: () => { if (!done) res(null); }

      $$('[data-i]', s.el).forEach(b => b.onclick = () => { done = true; s.close(true); res(options[+b.dataset.i].value); });
    });
  },
  confirm({ title, text, ok = 'Подтвердить', danger }) {
    return UI.choice({ title, text, options: [{ label: ok, value: true, cls: danger ? 'btn-danger' : 'btn-primary' }, { label: 'Отмена', value: false }] }).then(v => !!v);
  },
  prompt({ title, label, value = '', placeholder = '', type = 'text', ok = 'Сохранить' }) {
    return new Promise(res => {

        title, body: `<label class="label">${esc(label)}</label><input id="ui-prompt" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${type === 'number' ? 'inputmode="decimal"' : ''}>`,
