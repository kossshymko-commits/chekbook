# Чекбук — автоматическая сборка Android-приложения (APK).
# Запускается сама при каждой загрузке нового index.html. Готовый APK появляется в разделе Releases:
# https://github.com/kossshymko-commits/chekbook/releases/latest/download/chekbook.apk
name: Сборка APK

on:
  push:
    branches: [main]
    paths: ['index.html', 'icon-512.png', 'icon-maskable-512.png', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Подготовка проекта
        run: |
          set -e
          mkdir -p build/www/lib
          cd build
          npm init -y > /dev/null
          npm i --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/app@6
          cp ../index.html ../manifest.webmanifest ../icon-192.png ../icon-512.png www/
          sed -i "s/__BUILD__/${{ github.run_number }}/" www/index.html
          # Библиотеки кладём внутрь приложения — работает без интернета
          node -e '
            const fs = require("fs"), { execSync } = require("child_process");
            let s = fs.readFileSync("www/index.html", "utf8"); let n = 0;
            const urls = [...new Set((s.match(/https:\/\/(cdn\.jsdelivr\.net\/npm\/[^"\x27\x60\s)]+|cdn\.tailwindcss\.com)/g) || []))].filter(u => /tailwindcss\.com$|\.js$/.test(u)).sort((a, b) => b.length - a.length);
            for (const u of urls) {
              const f = "lib/" + (++n) + ".js";
              try { execSync("curl -fsSL --retry 3 -o www/" + f + " \"" + u + "\""); s = s.split(u).join(f); console.log("ok", u); }
              catch (e) { console.log("skip", u); }
            }
            fs.writeFileSync("www/index.html", s);
          '
          cat > capacitor.config.json <<'JSON'
          { "appId": "by.chekbook.app", "appName": "Чекбук", "webDir": "www" }
          JSON
          npx cap add android
          npx cap sync android

      - name: Иконки, разрешения, версия
        run: |
          set -e
          cd build/android/app
          which convert || (sudo apt-get update && sudo apt-get install -y imagemagick)
          M=src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <queries><intent><action android:name="android.media.action.IMAGE_CAPTURE" /></intent><intent><action android:name="android.intent.action.GET_CONTENT" /><data android:mimeType="image/*" /></intent></queries>\n    <application#' $M
          grep -q "IMAGE_CAPTURE" $M
          grep -q "fileprovider" $M || echo "WARN: no fileprovider" 
          R=src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${p%%:*}; s=${p##*:}
            mkdir -p $R/mipmap-$d
            convert ../../../icon-512.png -resize ${s}x${s} $R/mipmap-$d/ic_launcher.png
            cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_round.png
            convert ../../../icon-maskable-512.png -resize $((s*9/4))x$((s*9/4)) $R/mipmap-$d/ic_launcher_foreground.png || true
          done
          for f in $(find $R -name 'splash.png'); do
            W=$(identify -format '%w' $f); H=$(identify -format '%h' $f); I=$(( (W<H?W:H)/3 ))
            convert -size ${W}x${H} xc:'#EEF1F6' \( ../../../icon-512.png -resize ${I}x${I} \) -gravity center -composite $f
          done
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" build.gradle
          grep -n "versionCode\|versionName" build.gradle

      - name: Сборка
        run: |
          set -e
          # Постоянный ключ подписи: обновления ставятся поверх, данные не теряются
          echo "" | base64 -d > build/android/app/chekbook.jks
          cd build/android
          sed -i '0,/^android {/s//android {\n    signingConfigs { debug { storeFile file("chekbook.jks"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" } }/' app/build.gradle
          grep -n -A1 "signingConfigs" app/build.gradle
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../../chekbook.apk
          # Проверка: APK обязан быть подписан ключом Чекбука
          keytool -printcert -jarfile ../../chekbook.apk | tee /tmp/cert.txt | head -5
          grep -q "CN=Chekbook" /tmp/cert.txt

      - name: Публикация
        uses: softprops/action-gh-release@v2
        with:
          tag_name: b${{ github.run_number }}
          name: Чекбук, сборка ${{ github.run_number }}
          body: Установите chekbook.apk на телефон. Обновление ставится поверх, данные сохраняются.
          files: chekbook.apk
          make_latest: true
